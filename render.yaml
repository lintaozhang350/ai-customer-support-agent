services:
  - type: web
    name: lintao-ai-customer-support-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENABLE_LLM_CLASSIFIER
        value: "false"
      - key: ENABLE_LLM_ANSWER_GENERATION
        value: "false"
      - key: SUPPORT_DB_PATH
        value: /tmp/support.db
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://lintao-ai-customer-support-demo.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1

  - type: web
    name: lintao-ai-customer-support-demo
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lintao-ai-customer-support-api.onrender.com
